# Optional Render blueprint.
# Dashboard alternative: Build = pip install -r requirements.txt
# Start = bash bin/render_start.sh
# Env: DJANGO_SECRET_KEY, FRONTEND_URL=https://cox-solution-admin.vercel.app
# Optional: DATABASE_URL (Render Postgres; avoids ephemeral SQLite data loss).

services:
  - type: web
    name: cox-solution
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: bash bin/render_start.sh
